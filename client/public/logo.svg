<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded Rect Background -->
  <rect width="512" height="512" rx="120" fill="#00a5e5" />
  
  <!-- Clock Dotted Circle -->
  <circle cx="280" cy="240" r="140" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="2 18" stroke-linecap="round" />
  <circle cx="280" cy="240" r="140" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.3" />

  <!-- Clock Hands (L shape) -->
  <path d="M270 120 V240 H340" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Pill Capsule Body Overlapping Left -->
  <g transform="translate(90, 160) rotate(-45)">
    <!-- Capsule Outer Ring -->
    <rect x="0" y="0" width="220" height="110" rx="55" fill="none" stroke="#ffffff" stroke-width="20" />
    <!-- Filled Pill Half -->
    <path d="M55,10 A45,45 0 0,0 55,100 L110,100 L110,10 Z" fill="#ffffff" />
    <!-- Divider Line -->
    <line x1="110" y1="10" x2="110" y2="100" stroke="#00a5e5" stroke-width="10" />
  </g>
</svg>
